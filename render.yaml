services:
  - type: web
    name: synthetic-data-studio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt -c requirements-lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Set to your Vercel frontend URL after deploying, e.g.:
      # https://your-app.vercel.app,https://your-custom-domain.com
      - key: CORS_ORIGINS
        sync: false
      # Secret: set in Render dashboard → Environment → Secret Files / Env Vars
      # Comma-separated Gemini API keys, e.g.: key1,key2
      - key: GEMINI_API_KEYS
        sync: false
      # Optional: override default model, e.g.: models/gemini-2.5-flash
      - key: GEMINI_MODEL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: '900'
      - key: CACHE_MAX_BYTES
        value: '134217728'
      - key: MAX_UPLOAD_BYTES
        value: '15728640'
      - key: MAX_ROWS
        value: '50000'
      - key: MAX_COLUMNS
        value: '200'
      - key: MAX_CELLS
        value: '1000000'
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: MKL_NUM_THREADS
        value: '1'
